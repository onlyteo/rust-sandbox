[workspace]
resolver = "3"
members = [
    "apps/rust-warp-api-rest/backend",
    "apps/rust-warp-api-rest/frontend-api",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
warp = "0.4"
tokio = "1"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
bytes = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"