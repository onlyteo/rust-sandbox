[workspace]
resolver = "3"
members = [
    "libs/server",
    "libs/auth_handling",
    "libs/error_handling",
    "libs/yaml_config",
    "libs/observability",
    "libs/kafka_serde",
    "libs/kafka_client",
    "apps/rust-warp-api-rest/backend",
    "apps/rust-warp-api-rest/frontend-api",
    "apps/rust-axum-api-rest/backend",
    "apps/rust-axum-api-rest/frontend-api",
    "apps/rust-axum-crud-sqlx/backend",
    "apps/rust-axum-crud-sqlx/frontend",
    "tests/postgres_testcontainer",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
warp = "0.4"
axum = "0.8"
askama = "0.16"
tokio = "1.54"
tower = "0.5"
tower-http = "0.7"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
serde_yaml = "0.9"
apache-avro = "0.22" # Must be synked with version in schema_registry_converter
schema_registry_converter = "6.0"
headers = "0.4"
http-body-util = "0.1"
reqwest = "0.13"
sqlx = "0.9"
uuid = "1.29"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"
anyhow = "1.0"
chrono = "0.4"
strum = "0.28"
dtor = "1.0"

testcontainers = "0.27" # Must be synked with version in testcontainers-modules
testcontainers-modules = "0.15"
