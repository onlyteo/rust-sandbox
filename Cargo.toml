[workspace]
resolver = "3"
members = [
    "apps/rust-warp-api-rest/backend",
    "apps/rust-warp-api-rest/frontend-api",
    "apps/rust-axum-api-rest/backend",
    "apps/rust-axum-api-rest/frontend-api"
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = "0.8"
warp = "0.4"
tokio = "1.49"
tower-http = "0.6"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
bytes = "1.11"
http-body-util = "0.1"
hyper = "1.8"
hyper-util = "0.1"
reqwest = "0.13"
sqlx = "0.9.0-alpha.1"
dotenv = "0.15"
thiserror = "2.0"
anyhow = "1.0"