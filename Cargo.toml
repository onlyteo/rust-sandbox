[workspace]
resolver = "3"
members = [
    "libs/async_handler",
    "libs/yaml_config",
    "libs/observability",
    "libs/kafka_serde",
    "libs/kafka_client",
    "apps/rust-warp-api-rest/backend",
    "apps/rust-warp-api-rest/frontend-api",
    "apps/rust-axum-api-rest/backend",
    "apps/rust-axum-api-rest/frontend-api",
    "apps/rust-axum-crud-sqlx/backend",
    "apps/rust-axum-crud-sqlx/frontend",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
warp = "0.4"
axum = "0.8"
askama = "0.16"
axum-extra = "0.12"
tokio = "1.54"
tower = "0.5"
tower-http = "0.7"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
serde_yaml = "0.9"
bytes = "1.12"
apache-avro = "0.22"
http-body-util = "0.1"
hyper = "1.12"
hyper-util = "0.1"
reqwest = "0.13"
sqlx = { version = "0.9", features = ["postgres", "uuid", "macros", "chrono"] }
uuid = "1.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
