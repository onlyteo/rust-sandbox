[package]
name = "auth_handling"
version = "1.0.0"
edition.workspace = true

[features]
axum = ["dep:axum", "dep:headers", "dep:error_handling", "error_handling/axum"]
warp = ["dep:warp", "dep:headers", "dep:error_handling"]
basic_auth = []

[dependencies]
error_handling = { package = "error_handling", path = "../error_handling", default-features = false, optional = true }

serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
headers = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
warp = { workspace = true, optional = true }
