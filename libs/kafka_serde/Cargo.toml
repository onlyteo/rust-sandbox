[package]
name = "kafka_serde"
version = "1.0.0"
edition.workspace = true

[features]
default = ["json", "schema_registry"]
json = ["dep:serde_json"]
avro = ["dep:apache-avro"]
schema_registry = ["dep:apache-avro", "dep:schema_registry_converter"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
apache-avro = { workspace = true, optional = true }
schema_registry_converter = { workspace = true, optional = true, default-features = false, features = ["avro", "futures"] }
thiserror = { workspace = true }
