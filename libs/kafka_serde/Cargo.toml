[package]
name = "kafka_serde"
version = "1.0.0"
edition.workspace = true

[features]
default = ["json"]
json = ["dep:serde_json"]
avro = ["dep:apache-avro"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
apache-avro = { workspace = true, optional = true }
thiserror = { workspace = true }
