<!doctype html>
<html lang="en">
    <head>
        <title>Rust Sandbox</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/css/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="/webjars/font-awesome/css/all.min.css" />
        <link rel="stylesheet" type="text/css" href="/assets/css/style.css" />
    </head>
    <body>
        <header class="header mb-5">
            <nav class="navbar navbar-dark navbar-expand-lg p-4">
                <a class="navbar-brand mx-4" href="/">
                    <h1>
                        <i class="navbar-logo emphasized-text fa-solid fa-screwdriver-wrench"></i
                        ><span class="navbar-title ms-3">Rust Sandbox</span>
                    </h1>
                </a>
            </nav>
        </header>

        <main class="container" role="main">
            <div class="description-box px-3 py-5 rounded-3">
                <div class="row">
                    <div class="col">
                        <h2 class="emphasized-text">Welcome to this Rust example!</h2>
                        <p>This example shows a server rendered frontend and Rust/Axum CRUD SQLx</p>
                    </div>
                </div>
                <div class="row mt-5">
                    <div class="col"></div>
                    <div class="col-5">
                        <form method="post" action="/">
                            <div class="form-group">
                                <input
                                    type="text"
                                    name="name"
                                    class="form-control form-control-lg"
                                    placeholder="Enter your name here"
                                    autocomplete="off"
                                    required
                                />
                            </div>
                            <div class="mt-2 fs-6">
                                <input
                                    id="history"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="history"
                                    th:checked="${history} ? 'checked'"
                                />
                                <label for="history" class="form-check-label ms-1">Show history</label>
                            </div>
                            <div class="d-grid d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </form>
                    </div>
                    <div class="col"></div>
                </div>
                <div class="row mt-4">
                    <div class="col"></div>
                    <div class="col-5">
                        {% if let Some(alert) = alert %}
                        <div class="alert alert-{{ alert.variant }}" role="alert">{{ alert.message }}</div>
                        {% endif %}
                    </div>
                    <div class="col"></div>
                </div>
            </div>
        </main>

        <footer class="footer mt-5"></footer>
    </body>
</html>
