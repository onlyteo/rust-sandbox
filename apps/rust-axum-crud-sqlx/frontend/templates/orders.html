{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col">
        <h2 class="emphasized-text">Orders</h2>
    </div>
</div>
<div class="row mt-4">
    <div class="col">
        <table class="table table-dark table-striped align-middle">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Status</th>
                    <th>Items</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders %}
                <tr>
                    <td>{{ order.id }}</td>
                    <td>{{ order.status_label }}</td>
                    <td>{{ order.item_count }}</td>
                    <td><a class="btn btn-sm btn-primary" href="/orders/{{ order.id }}">View</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
