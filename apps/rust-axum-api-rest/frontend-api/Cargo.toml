[package]
name = "rust-axum-rest-api-frontend-api"
version = "1.0.0"
edition.workspace = true

[features]
docker = []

[lib]
name = "rust_axum_rest_api_frontend_api"
path = "src/lib.rs"

[dependencies]
server = { path = "../../../libs/server", features = ["axum", "tokio"] }
yaml_config = { path = "../../../libs/yaml_config" }
observability = { path = "../../../libs/observability" }
auth_handling = { path = "../../../libs/auth_handling", features = ["basic_auth"] }

axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
