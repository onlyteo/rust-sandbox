[package]
name = "rust-axum-rest-api-backend"
version = "0.1.0"
edition.workspace = true

[features]
docker = []

[lib]
name = "rust_axum_rest_api_backend"
path = "src/lib.rs"

[dependencies]
server = { path = "../../../libs/server", features = ["axum", "tokio"] }
yaml_config = { path = "../../../libs/yaml_config" }
observability = { path = "../../../libs/observability" }
error_handling = { path = "../../../libs/error_handling" }
auth_handling = { path = "../../../libs/auth_handling", features = ["basic_auth"] }

axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_derive = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
strum = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
